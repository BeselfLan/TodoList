<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A daily to-do list where every day gets its own page." />
    <meta name="theme-color" content="#f9b81a" />
    <title>The TodoList</title>
    <script>
      // Runs before first paint so a dark page never flashes light.
      document.documentElement.dataset.theme = localStorage.getItem('todoTheme')
        ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

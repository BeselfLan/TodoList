server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The API, served from this same origin so the browser never treats an
    # API call as cross-origin. Must come before `location /`: nginx prefers
    # the longest matching prefix, so /api/ wins for API calls while
    # everything else still falls through to the static files below.
    location /api/ {
        # Docker's embedded DNS server. Naming a resolver and passing the
        # upstream through a variable defers the lookup to request time --
        # with a literal hostname nginx resolves it once at startup and
        # refuses to boot if it fails, so a stopped server container would
        # take the static site down with it. This way the site keeps serving
        # and only /api/ returns 502 until the backend is back.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://server:3000;

        # Strips the /api/ prefix, so /api/data reaches Express as /data --
        # which is what app.js registers. Needed because proxy_pass with a
        # variable forwards the URI as rewritten rather than replacing the
        # matched prefix the way a literal proxy_pass with a trailing / does.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        # Without these the backend only ever sees nginx: every request would
        # appear to come from the container's IP over plain HTTP.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

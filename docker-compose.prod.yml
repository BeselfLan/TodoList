# Production overrides. Unlike docker-compose.override.yml, Compose does NOT
# load this automatically -- it has to be named explicitly, which also stops
# the dev override from being layered on by accident:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires DOMAIN in the root .env, e.g. DOMAIN=todo.example.com; the server's
# CLIENT_ORIGIN is derived from it below. HTTPS is handled by the server-wide
# Caddy in /root/home/edge, whose Caddyfile must have a matching site block,
# and the edge network must exist first (docker network create edge).
services:
  postgres:
    restart: unless-stopped

  server:
    restart: unless-stopped
    environment:
      # Derived from DOMAIN so the two can never drift apart. This overrides
      # the CLIENT_ORIGIN in server/.env, which points at the Vite dev server
      # for running outside Docker. After proxying, the app's own requests are
      # same-origin and ignore CORS entirely -- this is what keeps *other*
      # sites from calling the API out of a visitor's browser.
      CLIENT_ORIGIN: https://${DOMAIN:?missing from .env}
      # Caddy and nginx, in that order. Both append to X-Forwarded-For, so
      # Express has to skip two entries to find the real client IP. Rate
      # limiting counts per IP and would be meaningless without this.
      TRUST_PROXY: 2
    # No published ports: nginx reaches this over the compose network at
    # server:3000. Nothing outside Docker needs to talk to it directly, and
    # publishing 3000 would expose the API alongside the proxied path,
    # re-creating the cross-origin surface this setup exists to remove.
    ports: !override []

  client:
    build:
      context: ./client
      args:
        # Baked into the bundle at build time -- Vite inlines import.meta.env
        # during npm run build, so this cannot be changed at runtime. A
        # relative path makes the browser send API calls to whatever host it
        # loaded the page from, which is the whole point: same origin, no CORS.
        VITE_API_URL: /api
    restart: unless-stopped
    # Unpublished: the shared Caddy in /root/home/edge is the only way in.
    # Leaving 80 mapped here would serve the whole site over plain HTTP
    # alongside the HTTPS version.
    ports: !override []
    # "edge" is the server-wide network that Caddy (/root/home/edge) sits on;
    # it reaches this container as todolist-client:80. TLS, certificates and
    # access logs for DOMAIN are configured there, not in this repo.
    networks:
      default:
      edge:
        aliases:
          - todolist-client

networks:
  edge:
    external: true

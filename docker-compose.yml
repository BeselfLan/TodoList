services:
  postgres:
    image: postgres:16-alpine
    # Values come from the root .env (see .env.example). The :? suffix makes
    # Compose refuse to start with a clear error if one is missing, rather
    # than quietly booting Postgres with a blank password.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing from .env}
      POSTGRES_USER: ${POSTGRES_USER:?missing from .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing from .env}
    # No published port: the server reaches this over the compose network at
    # postgres:5432. Publishing it would expose the database on every host
    # interface, bypassing the API's auth entirely. The override file adds a
    # loopback-only mapping for local psql access.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # -U/-d must match the credentials above: pg_isready reports "accepting
    # connections" per database, and initdb briefly runs a throwaway server
    # that would otherwise look ready. $$ escapes the interpolation so the
    # container's shell expands these from its own environment, keeping them
    # in step with the values set above.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First boot has to run initdb before it listens for real; without this
      # the retries can be exhausted on a cold volume.
      start_period: 30s

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Built from the same .env values so the password lives in one place.
      # This wins over the DATABASE_URL in server/.env, which points at
      # localhost for running the server outside Docker.
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    env_file:
      - ./server/.env
    # Wait for Postgres to accept connections, not just for its container to
    # start: index.js exits if the first query fails.
    depends_on:
      postgres:
        condition: service_healthy
    # A crash on startup should not leave a container that looks Up with
    # nothing listening on 3000.
    restart: unless-stopped

  client:
    build:
      context: ./client
    ports:
      - "5173:80"
    environment:
      NODE_ENV: production
    depends_on:
      - server

volumes:
  postgres-data:

version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: todolist
      POSTGRES_PASSWORD: todolist
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://todolist:todolist@postgres:5432/todolist
    env_file:
      - ./server/.env
    depends_on:
      - postgres
    volumes:
      - ./server:/app

  client:
    build:
      context: ./client
    ports:
      - "5173:80"
    environment:
      NODE_ENV: production
    depends_on:
      - server
    volumes:
      - ./client:/app

volumes:
  postgres-data:
